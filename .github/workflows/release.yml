name: Release

# Pushing a tag like v0.1.0 builds the engine's packs (tools/pack.ts --build --strict, stamped with the tag's version) and
# attaches them to a GitHub release of that tag. A game outside this repository installs them by URL, with no registry and
# no login, because the repository is public:
#
#   "@rge/runtime": "https://github.com/nengler/react-game-engine/releases/download/v0.1.0/rge-runtime-0.1.0.tgz"
#
# @rge/native carries librge and rge-host built on this runner (linux-x64, desktop and headless), so the packs run on
# Linux x64 only, as the engine does today. CI (ci.yml, including the `outside` job) is what checks the code; this only builds
# and publishes what the tag points at, so tag a commit CI has passed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - run: npm run generate
      # The desktop librge links against the window libraries; without them only the headless one would ship.
      - name: Install the window libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev
      - name: Build librge and rge-host, and pack (stamped with the tag's version)
        run: node tools/pack.ts --build --strict --version "${GITHUB_REF_NAME#v}"
      - name: Attach the packs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/packs/*.tgz --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --notes "Install a pack by URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/<file>. Linux x64."
