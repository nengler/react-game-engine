name: CI

# Actions minutes are limited, so this workflow tries not to spend them twice:
# - a change that only touches markdown or docs/ runs nothing (no test reads them);
# - a new push to a pull request cancels the run still going for the old one;
# - the native jobs cache their raylib and QuickJS builds, which are most of their time. A cache is keyed on
#   the compiler versions and the files that decide what gets built, so a toolchain upgrade or a change to
#   CMakeLists.txt, Cargo.lock or build.rs starts from scratch; a change to the C or Rust sources rebuilds
#   only those sources.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Generated example output is up to date
        run: |
          npm run example
          git diff --exit-code -- packages/example/generated
          test -z "$(git ls-files --others --exclude-standard -- packages/example/generated)"
      - name: Demo generated output is up to date
        run: |
          npm run demo
          git diff --exit-code -- packages/demo/generated
          test -z "$(git ls-files --others --exclude-standard -- packages/demo/generated)"

  # librge on raylib's software renderer: no window, no GPU, no system libraries. Runs the C smoke
  # test, then the Node host (koffi) and the demo game against the real library. RGE_REQUIRE_NATIVE makes a missing
  # library a failure instead of a skip.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - name: Note the compiler versions (they key the build cache)
        id: toolchain
        run: echo "id=$(echo "$(cc -dumpfullversion) $(cmake --version | head -1)" | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache the librge build (raylib is most of it)
        uses: actions/cache@v4
        with:
          path: native/build-headless
          key: librge-headless-${{ steps.toolchain.outputs.id }}-${{ hashFiles('native/CMakeLists.txt') }}
          restore-keys: librge-headless-${{ steps.toolchain.outputs.id }}-
      - name: Build librge (software renderer)
        run: npm run native:build:headless
      - name: C smoke test
        run: ctest --test-dir native/build-headless --output-on-failure
      - name: Node host against the real library
        run: node --test --test-concurrency=1 "packages/player-node/test/*.test.ts" "packages/demo/test/*.test.ts"
        env:
          RGE_REQUIRE_NATIVE: "1"
      # The V8 build of a game: a Node single executable application. The parity run, packaged the same way, must print
      # exactly what it prints under plain Node; then the demo runs from another folder until it is stopped (status 124).
      - name: Package the demo with Node (V8) and run it
        run: |
          npm run package -- --engine node --headless
          npm run package -- packages/demo/parity.ts parity --engine node --headless
          node packages/demo/parity.ts > /tmp/parity-node.json
          cd /tmp
          "$GITHUB_WORKSPACE/dist/parity/parity" > /tmp/parity-packaged.json
          cmp /tmp/parity-node.json /tmp/parity-packaged.json
          timeout 5 "$GITHUB_WORKSPACE/dist/demo/demo" || test $? -eq 124

  # The same library on the real OpenGL path (GLFW), against Mesa's software GL on a virtual display.
  native-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - name: Install X11, GL and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libgl1-mesa-dri xvfb
      - name: Note the compiler versions (they key the build cache)
        id: toolchain
        run: echo "id=$(echo "$(cc -dumpfullversion) $(cmake --version | head -1) $(rustc --version)" | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache the librge build (raylib is most of it)
        uses: actions/cache@v4
        with:
          path: native/build
          key: librge-desktop-${{ steps.toolchain.outputs.id }}-${{ hashFiles('native/CMakeLists.txt') }}
          restore-keys: librge-desktop-${{ steps.toolchain.outputs.id }}-
      - name: Cache cargo and the host build (raylib and QuickJS are most of it)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            host/target
          key: host-desktop-${{ steps.toolchain.outputs.id }}-${{ hashFiles('host/Cargo.lock', 'host/build.rs', 'native/CMakeLists.txt') }}
          restore-keys: host-desktop-${{ steps.toolchain.outputs.id }}-
      - name: Build librge (OpenGL window)
        run: npm run native:build
      - name: C smoke test
        run: xvfb-run -a ctest --test-dir native/build --output-on-failure
      # One test file at a time: they all open windows on the same virtual display, and one run saw
      # GLFW fail once to connect to it ("X11: Failed to open display") while two files were opening windows.
      - name: Node host against the real library
        run: xvfb-run -a node --test --test-concurrency=1 "packages/player-node/test/*.test.ts" "packages/demo/test/*.test.ts"
        env:
          RGE_REQUIRE_NATIVE: "1"
          RGE_NATIVE_LIB: ${{ github.workspace }}/native/build/librge.so
      - name: Build the Rust host (OpenGL window)
        run: npm run host:build
      - name: Package the demo and run it under a virtual display
        run: |
          npm run package -- --engine quickjs
          cd /tmp
          # The game runs until its window closes, so stopping it after five seconds (status 124) is the pass.
          xvfb-run -a timeout 5 "$GITHUB_WORKSPACE/dist/demo/demo" || test $? -eq 124
      - name: Package the demo with Node (V8) and run it under a virtual display
        run: |
          npm run package -- --engine node
          cd /tmp
          xvfb-run -a timeout 5 "$GITHUB_WORKSPACE/dist/demo/demo" || test $? -eq 124

  # The shipping host: Rust + QuickJS-ng, linked statically against librge on raylib's software renderer.
  # The parity test plays the demo for 60 scripted frames under Node and under the host and requires
  # byte-identical output; the bench times scripts under both and fails a scene over its budget (`npm run bench:check`).
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - name: Note the compiler versions (they key the build cache)
        id: toolchain
        run: echo "id=$(echo "$(cc -dumpfullversion) $(cmake --version | head -1) $(rustc --version)" | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache cargo and the host build (raylib and QuickJS are most of it)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            host/target
          key: host-headless-${{ steps.toolchain.outputs.id }}-${{ hashFiles('host/Cargo.lock', 'host/build.rs', 'native/CMakeLists.txt') }}
          restore-keys: host-headless-${{ steps.toolchain.outputs.id }}-
      - name: Build the host (software renderer)
        run: npm run host:build:headless
      - name: Parity with Node, and host behaviour
        run: node --test --test-concurrency=1 "packages/demo/test/*.test.ts"
        env:
          RGE_HOST_BIN: ${{ github.workspace }}/host/target/release/rge-host
          RGE_REQUIRE_HOST: "1"
      # Fails when a scene is over its budget in packages/player/bench/budget.json, or grows faster than its size.
      - name: Script frame time under Node and under the host, against budgets
        run: npm run bench:check -- --host host/target/release/rge-host
      - name: Package the demo and run it
        run: |
          npm run package -- --engine quickjs --headless
          cd /tmp
          timeout 5 "$GITHUB_WORKSPACE/dist/demo/demo" || test $? -eq 124
