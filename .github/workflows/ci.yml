name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Generated example output is up to date
        run: |
          npm run example
          git diff --exit-code -- packages/example/generated
          test -z "$(git ls-files --others --exclude-standard -- packages/example/generated)"
      - name: Demo generated output is up to date
        run: |
          npm run demo
          git diff --exit-code -- packages/demo/generated
          test -z "$(git ls-files --others --exclude-standard -- packages/demo/generated)"

  # librge on raylib's software renderer: no window, no GPU, no system libraries. Runs the C smoke
  # test, then the Node host (koffi) and the demo game against the real library. RGE_REQUIRE_NATIVE makes a missing
  # library a failure instead of a skip.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - name: Build librge (software renderer)
        run: npm run native:build:headless
      - name: C smoke test
        run: ctest --test-dir native/build-headless --output-on-failure
      - name: Node host against the real library
        run: node --test --test-concurrency=1 "packages/player-node/test/*.test.ts" "packages/demo/test/*.test.ts"
        env:
          RGE_REQUIRE_NATIVE: "1"

  # The same library on the real OpenGL path (GLFW), against Mesa's software GL on a virtual display.
  native-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - name: Install X11, GL and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libgl1-mesa-dri xvfb
      - name: Build librge (OpenGL window)
        run: npm run native:build
      - name: C smoke test
        run: xvfb-run -a ctest --test-dir native/build --output-on-failure
      # One test file at a time: they all open windows on the same virtual display, and one run saw
      # GLFW fail once to connect to it ("X11: Failed to open display") while two files were opening windows.
      - name: Node host against the real library
        run: xvfb-run -a node --test --test-concurrency=1 "packages/player-node/test/*.test.ts" "packages/demo/test/*.test.ts"
        env:
          RGE_REQUIRE_NATIVE: "1"
          RGE_NATIVE_LIB: ${{ github.workspace }}/native/build/librge.so
      - name: Build the Rust host (OpenGL window)
        run: npm run host:build
      - name: Package the demo and run it under a virtual display
        run: |
          npm run package
          cd /tmp
          # The game runs until its window closes, so stopping it after five seconds (status 124) is the pass.
          xvfb-run -a timeout 5 "$GITHUB_WORKSPACE/dist/demo/demo" || test $? -eq 124

  # The shipping host: Rust + QuickJS-ng, linked statically against librge on raylib's software renderer.
  # The parity test plays the demo for 60 scripted frames under Node and under the host and requires
  # byte-identical output; the bench prints script frame time under both (informational).
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - name: Build the host (software renderer)
        run: npm run host:build:headless
      - name: Parity with Node, and host behaviour
        run: node --test --test-concurrency=1 "packages/demo/test/*.test.ts"
        env:
          RGE_HOST_BIN: ${{ github.workspace }}/host/target/release/rge-host
          RGE_REQUIRE_HOST: "1"
      - name: Script frame time under Node and under the host
        run: |
          npm run bundle -- packages/player/bench/frame.ts host/dist/bench.js
          echo "--- Node ---"
          node packages/player/bench/frame.ts
          echo "--- QuickJS-ng (rge-host) ---"
          host/target/release/rge-host host/dist/bench.js
      - name: Package the demo and run it
        run: |
          npm run package -- --headless
          cd /tmp
          timeout 5 "$GITHUB_WORKSPACE/dist/demo/demo" || test $? -eq 124
